# Local stack: PostgreSQL, Kafka (KRaft) and MinIO.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: crawl }
    ports: ["5432:5432"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000"]
