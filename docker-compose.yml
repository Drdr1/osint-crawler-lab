# Local stack: PostgreSQL, Kafka (KRaft) and MinIO.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: crawl }
    ports: ["5432:5432"]
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
  # MinIO no longer publishes community images; build one from source
  # (go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z) or use your own registry copy.
  minio:
    image: ${MINIO_IMAGE:-minio-local:RELEASE.2025-10-15T17-29-55Z}
    command: server /data
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000"]
