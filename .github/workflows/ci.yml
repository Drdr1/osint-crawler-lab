name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:3.9.0  # single-node KRaft, listens on localhost:9092
        ports: ["9092:9092"]
    env:
      CRAWLER_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/crawl
      CRAWLER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KAFKA_BOOTSTRAP: 127.0.0.1:9092
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z
      - name: Build MinIO from source
        # MinIO stopped publishing community images and binaries; the source is still public.
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup ~/go/bin/minio server /tmp/minio-data --address :9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live || (cat /tmp/minio.log; exit 1)
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9092) 2>/dev/null && break; sleep 2; done
      - name: Ruff
        run: ruff check src tests migrations && ruff format --check src tests migrations
      - name: MyPy (strict)
        run: mypy
      - name: Migration round trip
        env:
          CRAWLER_DATABASE_URL: ${{ env.CRAWLER_TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests (Postgres, Kafka, MinIO, Chromium, hostile target site)
        run: pytest -v -p no:logging
